/* v2 information architecture and visual refinements; base primitives are reused from v1. */
body{background:linear-gradient(135deg,#f6f6f7 0,#f0f1f3 100%)}

  <script>'use strict';
const DEVICE='RD-ONEG-0001',KEY='robotdock-demo-v2',SIGN='DEMO-ONLY-NOT-A-REAL-SIGNATURE';
const names={basic:'基础接入版',develop:'板载开发版',apply:'板载应用版'};
const appDefs={teleop:{name:'五点遥操',desc:'设备准备、输入校准、闭环验证与实验记录。',installed:true},show:{name:'演示表演',desc:'管理已适配动作与预设演示流程。',installed:false},three:{name:'三点遥操',desc:'预留能力。',installed:false},gem:{name:'GEM 视频控制',desc:'预留能力。',installed:false}};
const example=tier=>({schema:'robotdock-demo-license/v1',demo:true,device_id:DEVICE,license_id:'DEMO-'+tier.toUpperCase()+'-001',tier,features:tier==='basic'?['sdk']:tier==='develop'?['sdk','onboard']:['sdk','onboard','teleop','show'],expires_at:null,signature:SIGN});
function validate(x){if(!x||x.schema!=='robotdock-demo-license/v1'||x.demo!==true)throw Error('不是本 Demo 支持的授权格式。请下载下方示例 JSON。');if(x.device_id!==DEVICE)throw Error('设备不匹配：此文件不属于 '+DEVICE+'。当前授权未改变。');if(!Object.hasOwn(names,x.tier))throw Error('未知交付版本。');if(typeof x.license_id!=='string'||x.license_id.length>80)throw Error('授权编号格式不正确。');if(x.signature!==SIGN)throw Error('演示签名标记不匹配。真实签名验证需由边缘端实现。');if(!Array.isArray(x.features)||x.features.some(f=>!['sdk','onboard',...Object.keys(appDefs)].includes(f))||new Set(x.features).size!==x.features.length||!x.features.includes('sdk'))throw Error('能力清单无效。');if((x.tier==='basic'&&x.features.some(f=>f!=='sdk'))||(x.tier!=='basic'&&!x.features.includes('onboard'))||(x.tier!=='apply'&&x.features.some(f=>Object.hasOwn(appDefs,f))))throw Error('交付版本与能力清单不一致。');if(x.expires_at!==null&&(typeof x.expires_at!=='string'||!Number.isFinite(Date.parse(x.expires_at))||Date.parse(x.expires_at)<=Date.now()))throw Error('授权已过期或有效期格式无效。');return {schema:x.schema,demo:true,device_id:DEVICE,license_id:x.license_id,tier:x.tier,features:[...x.features],expires_at:x.expires_at,signature:SIGN};}
let license=example('basic'),hardware=true,camera=true,session=false,ip='192.168.50.10',route='overview',pending=null,pendingName='',readSeq=0,logs=[{time:'09:41:00',kind:'SYSTEM',text:'演示设备已载入；未建立任何真实连接。'}];
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){license=validate(saved.license);hardware=saved.hardware!==false;camera=saved.camera!==false;if(validIP(saved.ip))ip=saved.ip;}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({license,hardware,camera,ip}));}catch{toast('浏览器不允许本地保存；本次修改仅在当前页面有效。');}}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',network:'M12 3v7 M4 20v-5h16v5 M12 15v5 M8 3h8v5H8z',devices:'M7 3h10v18H7z M3 8h4 M17 8h4 M3 16h4 M17 16h4 M10 6h4',sdk:'M8 5 2 12l6 7 M16 5l6 7-6 7 M14 3l-4 18',logs:'M5 3h14v18H5z M8 7h8 M8 12h8 M8 17h5',license:'M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6z M8 12l3 3 5-6',apps:'M4 4h16v16H4z M9 4v16 M9 10h11',develop:'M3 5h18v14H3z M6 9l3 3-3 3 M12 15h5',info:'M12 8v1 M12 12v5 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20'};
const icon=k=>`<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${paths[k]||paths.info}"/></svg></span>`;
const badge=(text,type='')=>`<span class="tag ${type}">${esc(text)}</span>`;
const button=(text,action,primary=false,disabled=false)=>`<button data-action="${action}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${text}</button>`;
const row=(title,sub,right)=>`<div class="row"><div><strong>${esc(title)}</strong><small>${esc(sub)}</small></div>${right}</div>`;
const strip=(text,type='')=>`<div class="strip ${type}">${icon('info')}<span>${esc(text)}</span></div>`;
const title=(label,sub,action='')=>`<div class="heading"><div><div class="eyebrow">ROBOTDOCK / ${route.toUpperCase()}</div><h1>${label}</h1><p>${sub}</p></div>${action}</div>`;
function allowed(){return ['overview','network','devices','sdk','logs','license',...(license.tier==='develop'?['develop']:[]),...(license.tier==='apply'?['apps']:[])];}
const labels={overview:'设备概览',network:'网络连接',devices:'外设管理',sdk:'SDK 与接入',logs:'诊断与日志',license:'授权与版本',develop:'开发环境',apps:'应用工作台'};
const art=`<div class="device-art"><svg viewBox="0 0 240 250" role="img" aria-label="RobotDock 背包结构示意，非真实产品尺寸"><defs><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#626873"/><stop offset=".35" stop-color="#292d34"/><stop offset="1" stop-color="#101216"/></linearGradient></defs><path d="M67 38 144 23l55 28v155l-76 24-56-32z" fill="url(#metal)" stroke="#8e949f"/><path d="m67 38 55 31 77-18 M122 69v161" fill="none" stroke="#858b96"/><path d="M78 57v127l31 18V75z" fill="#14171c" stroke="#555c68"/><path d="m139 77 44-13v114l-44 14z" fill="#111318" stroke="#565d69"/><g stroke="#646b77" stroke-width="2"><path d="m145 86 31-9m-31 18 31-9m-31 18 31-9m-31 18 31-9m-31 18 31-9m-31 18 31-9m-31 18 31-9m-31 18 31-9"/></g><path d="m139 200 14-4v9l-14 5z m21-6 13-4v9l-13 4z" fill="#9299a7"/><circle cx="88" cy="94" r="4" fill="#d9dce3"/><text x="80" y="144" fill="#b9bec8" font-size="10" transform="rotate(28 80 144)">ONE-G</text><path d="M55 205H23v-30 M194 30h22v30" stroke="#797f89" fill="none" stroke-dasharray="3 4"/></svg><span>EDGE COMPUTE MODULE · 结构示意</span></div>`;
function overview(){const basic=license.tier==='basic';return title('你的设备，尽在掌握。','管理连接、检查能力，从这里开始。',button('检查设备状态','diagnose',true))+`<div class="grid"><section class="panel hero"><div class="hero-copy"><div class="eyebrow">ONE-G ROBOTICS / EDGE PLATFORM</div>${badge('演示设备 · 管理服务就绪')}<h2>RobotDock</h2><div class="serial mono">${DEVICE}</div><div class="bottom">统一设备管理底座<br>硬件、授权、运行条件，分别核验。</div></div>${art}</section><section class="panel license-summary"><div><div class="eyebrow">DELIVERY & ENTITLEMENT</div>${badge('离线授权 · 演示')}<h2>${names[license.tier]}</h2><p>${basic?'提供基础 SDK 与接入能力。算法由外部工作站自行开发运行。':license.tier==='develop'?'板载开发环境开放。客户自行部署算法，不包含预设应用。':'板载应用按授权开放；运行前仍需核对硬件、安装与设备条件。'}</p></div>${button('查看授权与能力 →','license')}</section></div><div class="metrics"><div class="metric"><span>计算位置</span><strong>${basic?'外部工作站':'板载计算'}</strong><small>${basic?'SDK 接入 · 自主开发':hardware?'Orin NX 16GB · 示例配置':'算力条件待满足'}</small></div><div class="metric"><span>核心温度 · 模拟</span><strong>42<span> °C</span></strong><small>快照数据，非实时监测</small><div class="meter" style="--value:42%"><i></i></div></div><div class="metric"><span>存储使用 · 模拟</span><strong>128<span> / 512 GB</span></strong><small>示例容量，不代表交付规格</small><div class="meter" style="--value:25%"><i></i></div></div><div class="metric"><span>当前控制会话</span><strong>${session?'模拟占用':'未启动'}</strong><small>${session?'授权变更暂时锁定':'本 Demo 不执行机器人控制'}</small></div></div><div class="grid equal"><section class="panel"><div class="section-head"><h2>连接一览</h2>${badge('模拟快照')}</div>${row('机器人接口','G1 · 有线网络',badge('链路已识别','ok'))}${row('相机接口','USB 3 · RGB-D 示例',badge(camera?'设备已识别':'未连接',camera?'ok':'warn'))}${row('SDK 服务',ip+' · 示例地址',badge('接口就绪','ok'))}</section><section class="panel"><div class="section-head"><h2>下一步</h2><span class="mono muted">01 / CONNECT</span></div><h3>${basic?'从 SDK 开始接入':license.tier==='develop'?'准备你的板载开发环境':'查看已交付的应用'}</h3><p class="muted small" style="margin:12px 0 20px">${basic?'获取设备地址和接口约定，再从外部工作站发起调用。这里不提供遥操控制入口。':'授权不等于运行就绪。请先核对算力环境与设备状态。'}</p>${button(basic?'打开 SDK 接入指南 →':license.tier==='develop'?'查看开发环境 →':'打开应用工作台 →',basic?'sdk':license.tier==='develop'?'develop':'apps')}</section></div>`;}
function licensePage(){return title('授权与版本','同一套软件，按交付能力开放。硬件故障不会改变授权档位。')+`<div class="grid"><section class="panel"><div class="section-head"><h2>当前交付能力</h2>${badge(names[license.tier])}</div><dl class="summary-list"><dt>绑定设备</dt><dd class="mono">${DEVICE}</dd><dt>授权编号</dt><dd class="mono">${esc(license.license_id)}</dd><dt>有效期</dt><dd>${license.expires_at?esc(license.expires_at):'永久 · 演示授权'}</dd><dt>校验方式</dt><dd>仅结构、设备绑定与演示标记检查</dd></dl><div class="section">${row('设备管理 + 基础 SDK','三个版本均标配',badge('已开放','ok'))}${row('板载开发能力','需要匹配的板载硬件',badge(license.features.includes('onboard')?'已授权':'未交付',license.features.includes('onboard')?'ok':''))}${row('应用包',license.features.filter(f=>appDefs[f]).map(f=>appDefs[f].name).join('、')||'当前不包含预设应用',badge(license.tier==='apply'?'按清单开放':'自主开发'))}</div>${strip('此 HTML 不验证真实数字签名，不能作为生产授权系统。真实授权和运行权限必须由背包服务核验。')}</section><section class="panel"><h2>导入离线授权</h2><div class="steps"><div class="step-card current"><span class="number">01</span><b>选择文件</b><p>JSON 示例文件</p></div><div class="step-card"><span class="number">02</span><b>核对能力</b><p>预览，不立即生效</p></div><div class="step-card"><span class="number">03</span><b>确认应用</b><p>更新本地 Demo</p></div></div><div class="filebox">${icon('license')}<h3>选择授权文件</h3><p>仅支持本 Demo JSON，最大 64 KB</p><input type="file" id="license-file" accept=".json,application/json" aria-label="选择授权 JSON 文件" ${session?'disabled':''}><p>不会上传文件，不会连接服务器。</p></div><div id="import-error" class="error" role="alert"></div>${session?strip('模拟会话占用中。请在「演示场景」结束占用后再导入。','warn'):''}</section></div><section class="panel section"><div class="section-head"><h2>试用三档授权</h2><span class="small muted">仅供原型体验 · 不是真实授权文件</span></div><div class="samples">${Object.entries(names).map(([k,n],i)=>`<article class="sample"><div class="code">0${i+1} / ${['CONNECT','DEVELOP','APPLY'][i]}</div><h3>${n}</h3><p>${['基础 SDK、设备管理；不包含遥操应用。','增加板载开发能力，算法由客户部署。','示例含五点遥操与演示表演授权。'][i]}</p><div class="actions">${button('下载示例 JSON','download-'+k)}${button('预览此示例','sample-'+k,false,session)}</div></article>`).join('')}</div></section>`;}
function ready(id){if(!license.features.includes(id))return '未授权';if(!hardware)return '板载算力条件不足';if(!appDefs[id].installed)return '应用包未安装';if(id==='teleop'&&!camera)return '示例数采配置要求的相机未连接';if(session)return '模拟会话占用中';return '';}
function appsPage(){return title('应用工作台','只展示应用能力，不将授权状态当作运行许可。')+strip('所有入口仅演示页面流程。未接入 PICO、机器人或真实算法。')+`<div class="app-grid section">${Object.entries(appDefs).map(([id,a],i)=>{const owned=license.features.includes(id),reason=ready(id);return `<article class="panel app-card"><div class="section-head"><span class="app-number">APP / 0${i+1}</span>${badge(owned?'已授权':'未授权',owned?'ok':'')}</div><h2>${a.name}</h2><p>${a.desc}</p><div class="app-meta">${badge(a.installed?'示例包已安装':'未安装')}${badge(reason||'演示条件满足',reason?'warn':'ok')}</div>${button(reason||'查看引导 Demo →','launch-'+id,!reason,!!reason)}<div class="notice">${owned&&!a.installed?'授权保留，仍需部署应用包。':!owned?'此应用不在当前交付清单内。':'运行条件仅用于展示，不是硬件验收结果。'}</div></article>`;}).join('')}</div>`;}
function network(){return title('网络连接','地址用于演示 SDK 接入；修改不会影响真实网卡。')+`<div class="grid equal"><section class="panel"><h2>设备管理网口</h2>${row('ETH 0','管理与 SDK 接入',badge('模拟已连接','ok'))}<form id="network-form"><label class="field">IPv4 地址<input name="ip" value="${esc(ip)}" autocomplete="off" required aria-describedby="ip-help"></label><p id="ip-help" class="small muted">示例默认：192.168.50.10。只更新本地 Demo。</p><div id="ip-error" class="error" role="alert"></div><div class="section"><button class="primary" type="submit">保存模拟地址</button></div></form></section><section class="panel"><h2>连接分工</h2>${row('ETH 1 · 机器人网络','192.168.123.x · 示例专用链路',badge('只读展示'))}${row('Wi-Fi · 管理入口','RobotDock-Lab · 示例网络',badge('只读展示'))}${row('外部工作站',license.tier==='basic'?'客户通过 SDK 开发算法':'当前交付支持板载计算',badge('不代替控制链路'))}${strip('正式产品修改网络前需提示断连风险，并提供超时回退；本 Demo 不修改网络。')}</section></div>`;}
function devices(){return title('外设管理','已识别 ≠ 接口可用 ≠ 应用已适配。')+`<section class="panel">${row('G1 机器人接口','设备识别：已识别 · 接口状态：模拟就绪 · 应用兼容性：待样机验证',badge('模拟'))}${row('RGB-D 相机 · 示例',camera?'设备识别：已识别 · 驱动：示例就绪 · 应用适配：待验证':'设备识别：未连接 · 驱动与应用状态不可确认',badge(camera?'已识别':'未连接',camera?'ok':'warn'))}${row('左 / 右末端','未选配主动夹爪或灵巧手；不提供开合操作',badge('未配置'))}${row('存储介质','SSD 512 GB · 容量和使用量均为示例',badge('模拟可用','ok'))}</section>${strip('通过右上角「演示场景」可模拟相机断开；应用授权不会随外设状态改变。')}`;}
function sdk(){return title('SDK 与接入','基础接口三个版本均提供，算法与应用由各档交付范围决定。',button('下载接口说明','sdk-doc',true))+`<div class="grid equal"><section class="panel"><h2>接入信息</h2><div class="section"><dl class="summary-list"><dt>设备编号</dt><dd class="mono">${DEVICE}</dd><dt>管理地址</dt><dd class="mono">${esc(ip)}</dd><dt>接口版本</dt><dd>v1 · 拟议接口，尚未实现</dd><dt>验证方式</dt><dd>设备令牌 · 正式方案待确定</dd></dl></div>${strip('下面是接口约定示意，不能直接调用真实机器人。网页未发起任何网络请求。')}</section><section class="panel"><h2>最小调用示例</h2><pre># 示例约定 · 非已发布 SDK\nGET /api/v1/device\nGET /api/v1/peripherals\nGET /api/v1/health\n\n# 示例响应\n{\n  "device_id": "${DEVICE}",\n  "source": "demo",\n  "control_enabled": false\n}</pre></section></div><section class="panel section"><h2>基础接口边界</h2>${row('状态读取','设备信息、网络状态、外设枚举与诊断',badge('基础能力'))}${row('控制接口','具体范围、权限及保护机制另行定义',badge('待定义'))}${row('不包含的能力','重定向、策略模型、五点校准、一键接管',badge('非基础 SDK 应用'))}</section>`;}
function develop(){return title('开发环境','板载平台由客户自主开发；不预装遥操应用。')+`<section class="panel"><div class="section-head"><h2>板载开发能力</h2>${badge(hardware?'示例环境就绪':'硬件条件不足',hardware?'ok':'warn')}</div>${row('计算平台',hardware?'Orin NX 16GB · 示例':'当前模拟硬件不满足板载配置',badge('授权仍有效','ok'))}${row('开发环境','驱动、基础 SDK、开发文档与示例',badge('交付范围'))}${row('客户程序','尚未部署；此原型不提供 Shell 或任意代码执行',badge('等待开发'))}${button('查看 SDK 文档 →','sdk')}</section>`;}
function logsPage(){return title('诊断与日志','仅记录当前 Demo 操作，不读取设备日志。',button('运行模拟检查','diagnose',true))+`<section class="panel"><div class="section-head"><h2>会话事件</h2>${button('导出诊断 JSON','export-logs')}</div>${logs.slice().reverse().map(l=>`<div class="log"><time>${esc(l.time)}</time><span class="mono">${esc(l.kind)}</span><span>${esc(l.text)}</span></div>`).join('')}</section>`;}
function render(focus=false){if(!allowed().includes(route))route='overview';document.getElementById('nav').innerHTML=allowed().map(k=>`<a href="#${k}" ${route===k?'aria-current="page"':''}>${icon(k)}${labels[k]}</a>`).join('');document.getElementById('crumb').textContent=labels[route];document.getElementById('main').innerHTML=({overview,license:licensePage,network,devices,sdk,logs:logsPage,develop,apps:appsPage}[route])()+`<footer class="footnote"><span>ONE-G ROBOTICS / RobotDock · Unified device platform</span><span>交互 Demo · 不访问网络，不发送机器人指令</span></footer>`;if(focus)document.getElementById('main').focus({preventScroll:true});}
function go(r){if(!allowed().includes(r))r='overview';if(location.hash==='#'+r){route=r;render(true);}else location.hash=r;}
window.addEventListener('hashchange',()=>{route=location.hash.slice(1);render(true);});
let toastTimer;function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4000);}
function log(kind,text){logs.push({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),kind,text});if(logs.length>100)logs.shift();}
function download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成演示文件：'+name);}
const modal=document.getElementById('modal');let restoreFocus;
function open(title,body){restoreFocus=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;modal.showModal();}
function close(){modal.close();pending=null;restoreFocus?.isConnected&&restoreFocus.focus();}
document.getElementById('close-modal').onclick=close;modal.addEventListener('cancel',e=>{e.preventDefault();close();});
function preview(x,name){if(session)throw Error('模拟会话占用中，不能变更授权。');pending=validate(x);pendingName=name;open('核对授权变更',`<p class="notice">文件：${esc(name)}。当前配置尚未改变。</p><dl class="summary-list"><dt>绑定设备</dt><dd class="mono">${DEVICE}</dd><dt>当前版本</dt><dd>${names[license.tier]}</dd><dt>变更为</dt><dd><strong>${names[pending.tier]}</strong></dd><dt>应用清单</dt><dd>${pending.features.filter(f=>appDefs[f]).map(f=>appDefs[f].name).join('、')||'无预设应用'}</dd><dt>校验结果</dt><dd>结构、设备绑定、演示标记符合</dd></dl>${strip('这不是密码学签名验证。只更新本浏览器中的 Demo，不升级硬件、不安装应用。','warn')}<label class="check-row"><input type="checkbox" id="confirm-license"><span>我已核对设备与能力，确认应用这份演示授权。</span></label><div class="actions">${button('确认应用','apply-license',true,true)}${button('取消','cancel')}</div>`);}
document.addEventListener('change',async e=>{if(e.target.id==='confirm-license')document.querySelector('[data-action="apply-license"]').disabled=!e.target.checked||session;if(e.target.id==='license-file'){const file=e.target.files[0],seq=++readSeq;if(!file)return;const error=document.getElementById('import-error');error.textContent='';e.target.disabled=true;try{if(file.size>65536)throw Error('文件超过 64 KB，请选择 Demo 授权 JSON。');const x=JSON.parse(await file.text());if(seq!==readSeq||route!=='settings/license')return;preview(x,file.name);}catch(err){error.textContent=err instanceof SyntaxError?'文件不是有效 JSON。当前授权未改变。':err.message;log('REJECT',error.textContent);}finally{e.target.disabled=session;e.target.value='';}}});
function validIP(v){if(typeof v!=='string')return false;const p=v.split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&+x<=255)&&+p[0]>0&&+p[0]<224&&+p[0]!==127&&+p[3]>0&&+p[3]<255;}
document.addEventListener('submit',e=>{if(e.target.id==='network-form'){e.preventDefault();const value=e.target.elements.ip.value.trim();if(!validIP(value)){document.getElementById('ip-error').textContent='请输入有效的单播 IPv4 主机地址，例如 192.168.50.10。';e.target.elements.ip.focus();return;}ip=value;persist();log('NETWORK','模拟管理地址更新为 '+ip+'；真实网络未改变。');render();toast('模拟地址已保存，未修改真实网络。');}});
document.getElementById('scenario').onclick=()=>open('演示场景',`<p class="notice">这些开关只模拟运行条件，不改变授权档位。所有设备数据均为演示值。</p><label class="toggle-row"><span>板载算力满足示例要求<br><small class="muted">关掉后，应用版保留授权但无法进入应用</small></span><input id="hw-toggle" type="checkbox" ${hardware?'checked':''}></label><label class="toggle-row"><span>示例相机已连接<br><small class="muted">用于五点遥操＋数采组合的示例依赖</small></span><input id="camera-toggle" type="checkbox" ${camera?'checked':''}></label><label class="toggle-row"><span>模拟会话占用<br><small class="muted">开启后拦截授权变更；并非真实控制会话</small></span><input id="session-toggle" type="checkbox" ${session?'checked':''}></label><div class="actions section">${button('应用演示条件','save-scenario',true)}${button('关闭','cancel')}</div>`);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(allowed().includes(a)){go(a);return;}if(a.startsWith('download-'))return download('RobotDock-'+a.slice(9)+'-demo.json',example(a.slice(9)));if(a.startsWith('sample-')){try{preview(example(a.slice(7)),'内置演示示例 · '+names[a.slice(7)]);}catch(err){toast(err.message);}return;}if(a==='cancel')return close();if(a==='apply-license'){if(session||!pending||!document.getElementById('confirm-license')?.checked)return;try{license=validate(pending);persist();log('LICENSE','应用演示授权：'+names[license.tier]+'；未校验真实签名。');close();render();toast('演示授权已应用，能力与导航已更新。');}catch(err){toast(err.message);}return;}if(a==='save-scenario'){hardware=document.getElementById('hw-toggle').checked;camera=document.getElementById('camera-toggle').checked;session=document.getElementById('session-toggle').checked;persist();log('SCENARIO','模拟条件更新，授权档位保持 '+names[license.tier]);close();render();toast('演示条件已更新，未操作真实设备。');return;}if(a==='diagnose'){const checks=['公共管理服务：模拟正常','SDK 接口：模拟就绪','当前交付：'+names[license.tier],license.tier==='basic'?'外部计算：由客户工作站承担':hardware?'板载条件：示例满足':'板载条件：不足，相应应用保持拦截',camera?'相机：模拟已连接':'相机：模拟未连接'];checks.forEach(x=>log('CHECK',x));open('模拟检查完成',checks.map(x=>row(x,'',badge('演示'))).join('')+strip('以上来自演示场景，不是实际设备检查。')+`<div class="actions section">${button('查看诊断日志','open-logs',true)}${button('关闭','cancel')}</div>`);return;}if(a==='open-logs'){close();go('diagnostics/logs');return;}if(a==='export-logs')return download('RobotDock-demo-diagnostics.json',{demo:true,device:DEVICE,tier:license.tier,hardware,camera,events:logs});if(a==='sdk-doc')return download('RobotDock-SDK-接口示意.txt','RobotDock SDK 接口示意（尚未实现）\n设备：'+DEVICE+'\n模拟地址：'+ip+'\nGET /api/v1/device\nGET /api/v1/peripherals\nGET /api/v1/health\n控制接口范围、安全机制与鉴权另行定义。\n此文档不包含可调用的真实接口。','text/plain');if(a.startsWith('launch-')){const id=a.slice(7);if(!appDefs[id]||ready(id))return toast('当前运行条件不满足。');open('五点遥操   return title('诊断日志','查看历史事件、筛选故障线索，并导出给技术支持。',button('导出诊断 JSON','export-logs'))+diagnosticTabs()+`<section class="panel"><div class="section-head"><h2>会话事件</h2>${badge('仅 Demo 操作记录')}</div>${logs.slice().reverse().map(l=>`<div class="log"><time>${esc(l.time)}</time><span class="mono">${esc(l.kind)}</span><span>${esc(l.text)}</span></div>`).join('')}</section>${strip('应用错误会先在应用原位说明原因；这里用于查看更完整的历史和导出信息。')}`;
}

function apiPage(){
  const onboard=license.features.includes('onboard');
  if(route==='api/connection')return title('API 接入信息','三个版本都提供基础接口；计算位置由授权与硬件共同决定。')+apiTabs()+`<div class="grid equal"><section class="panel"><div class="section-head"><h2>连接参数</h2>${badge('示例接口','ok')}</div><dl class="summary-list"><dt>设备编号</dt><dd class="mono">${DEVICE}</dd><dt>管理地址</dt><dd class="mono">${esc(ip)}</dd><dt>Base URL</dt><dd class="mono">http://${esc(ip)}/api/v1</dd><dt>接口版本</dt><dd>v1 · 拟议接口</dd><dt>鉴权</dt><dd>设备令牌 · 正式方案待确定</dd></dl>${strip('本页面未发起网络请求，地址和令牌均为界面方案示意。')}</section><section class="panel"><div class="section-head"><h2>计算模式</h2>${badge(onboard?(hardware?'板载模拟就绪':'板载硬件待处理'):'外部工作站',onboard&&hardware?'ok':onboard?'warn':'')}</div>${row('程序运行位置',onboard?'RobotDock 板载计算模块':'用户外部工作站',badge(onboard?'板载':'外部'))}${row('Web 的职责','查看基础信息、接口约定与服务状态',badge('管理面'))}${row('二次开发方式','客户程序通过 API / SDK 调用',badge('标准接口','ok'))}${onboard&&!hardware?strip('授权包含板载能力，但当前模拟硬件条件不足。授权本身没有变化。','warn'):''}</section></div><section class="panel section boundary"><h3>不是 Web 开发平台</h3><p>开发版不要求用户在浏览器里管理自己的程序。RobotDock Web 负责设备信息、连接、诊断和 API 说明；二次开发者在自己的工具链中调用 API。</p></section>`;
  return title('API 文档与示例','查接口、下载说明，从自己的开发环境发起调用。',button('下载接口说明','sdk-doc',true))+apiTabs()+`<div class="grid equal"><section class="panel"><h2>接口目录</h2>${row('设备信息','读取型号、序列号、版本与授权摘要',badge('GET'))}${row('连接与外设','读取网口、G1 接口和外设枚举',badge('GET'))}${row('健康与诊断','读取公共检查结果和诊断摘要',badge('GET'))}${row('应用目录','应用版读取内置应用及其运行条件',badge('GET'))}</section><section class="panel"><h2>最小调用示例</h2><pre># 拟议接口 · 尚未实现&#10;GET /api/v1/device&#10;GET /api/v1/peripherals&#10;GET /api/v1/health&#10;&#10;{&#10;  "device_id": "${DEVICE}",&#10;  "source": "demo",&#10;  "control_enabled": false&#10;}</pre></section></div><section class="panel section"><h2>接口边界</h2>${row('基础读取','设备信息、网络、外设枚举、健康与诊断',badge('全版本'))}${row('控制与任务接口','权限、状态机和安全保护仍需按应用定义',badge('待定义','warn'))}${row('不属于基础 SDK','PICO 校准、重定向、Shadow 验证与一键接管',badge('应用能力'))}</section>`;
}

function licensePage(){
  return title('授权与能力','授权决定“交付了什么”，不代替软件安装或运行条件。')+settingTabs()+`<div class="grid"><section class="panel"><div class="section-head"><h2>当前交付能力</h2>${badge(names[license.tier],'ok')}</div><dl class="summary-list"><dt>绑定设备</dt><dd class="mono">${DEVICE}</dd><dt>授权编号</dt><dd class="mono">${esc(license.license_id)}</dd><dt>有效期</dt><dd>${license.expires_at?esc(license.expires_at):'永久 · 演示授权'}</dd><dt>校验方式</dt><dd>结构、设备绑定与固定演示标记</dd></dl><div class="section">${row('设备管理 + 基础 API','三个版本均标配',badge('已开放','ok'))}${row('板载计算能力','由开发版或应用版授权',badge(license.features.includes('onboard')?'已授权':'未交付',license.features.includes('onboard')?'ok':''))}${row('内置应用',license.features.filter(f=>productApps[f]).map(f=>productApps[f].name).join('、')||'当前不包含',badge(license.tier==='apply'?'按清单开放':'不包含'))}</div>${strip('此 HTML 不能验证真实数字签名。生产授权、设备身份与运行权限必须由边缘端服务核验。')}</section><section class="panel"><h2>导入离线授权</h2><div class="steps"><div class="step-card current"><span class="number">01</span><b>选择文件</b><p>读取本地 JSON</p></div><div class="step-card"><span class="number">02</span><b>核对能力</b><p>预览，不立即生效</p></div><div class="step-card"><span class="number">03</span><b>确认应用</b><p>更新本地 Demo</p></div></div><div class="filebox">${icon('license')}<h3>选择授权文件</h3><p>仅支持本 Demo JSON，最大 64 KB</p><input type="file" id="license-file" accept=".json,application/json" aria-label="选择授权 JSON 文件" ${session?'disabled':''}><p>文件不会上传，也不会连接服务器。</p></div><div id="import-error" class="error" role="alert"></div>${session?strip('模拟会话占用中。结束占用后才能变更授权。','warn'):''}</section></div><section class="panel section"><div class="section-head"><h2>试用三档授权</h2><span class="small muted">仅用于查看同一界面如何按授权变化</span></div><div class="samples">${Object.entries(names).map(([k,n],i)=>`<article class="sample"><div class="code">0${i+1} / ${['CONNECT','DEVELOP','APPLY'][i]}</div><h3>${n}</h3><p>${['外部工作站 + 基础 API / SDK，不包含内置应用。','增加板载计算，客户仍通过 API / SDK 二次开发。','在公共能力上增加按授权交付的内置应用。'][i]}</p><div class="actions">${button('下载示例 JSON','download-'+k)}${button('预览此示例','sample-'+k,false,session)}</div></article>`).join('')}</div></section>`;
}

function settingsPage(){
  const appTier=license.tier==='apply';
  if(route==='settings/license')return licensePage();
  if(route==='settings/system')return title('系统与版本','分别显示安装版本、授权能力和环境状态，避免混为一谈。')+settingTabs()+`<div class="grid equal"><section class="panel"><div class="eyebrow">INSTALLED SOFTWARE</div><h2>RobotDock System</h2><div class="system-version">0.1.0-demo</div>${row('管理前端','统一 Web Console · 演示构建',badge('已安装','ok'))}${row('公共服务','Device / API / Diagnostics',badge('已安装','ok'))}${row('运行引擎','SONIC Runtime · 仅应用依赖示意',badge(license.tier==='apply'?'随应用核验':'未要求'))}</section><section class="panel"><div class="eyebrow">RUNTIME ENVIRONMENT</div><h2>当前环境</h2>${row('计算平台',license.tier==='basic'?'外部工作站模式':'Orin NX 16GB · 示例',badge(license.tier==='basic'?'外部':hardware?'模拟就绪':'条件不足',hardware?'ok':'warn'))}${row('授权档位',names[license.tier],badge(licenseExpired()?'已过期':'有效',licenseExpired()?'bad':'ok'))}${row('控制会话',session?'模拟占用':'未启动',badge(session?'占用':'空闲',session?'warn':'ok'))}${strip('已授权不等于已安装，已安装也不等于当前可运行。应用启动前仍需独立核验。')}</section></div>`;
  return title('存储','管理系统空间、日志与业务数据的保留策略。')+settingTabs()+`<div class="grid equal"><section class="panel"><div class="section-head"><h2>系统盘 · 模拟</h2>${badge('正常','ok')}</div><div class="system-version">128 / 512 GB</div><div class="storage-bar"><i></i></div><p class="small muted">已用 25% · 容量仅为产品界面示意</p>${row('系统与运行库','46 GB',badge('受保护'))}${row('诊断日志','2.4 GB',badge('保留 30 天'))}${row(appTier?'应用与采集数据':'客户业务数据','79.6 GB',badge('按项目管理'))}</section><section class="panel"><h2>数据边界</h2>${row('公共诊断日志','在“检测与诊断”中查看和导出',badge('系统数据'))}${appTier?row('遥操采集记录','进入“五点遥操与数采”应用管理',badge('应用数据')):row('客户业务数据','由客户程序通过约定目录或 API 管理',badge('开发数据'))}${row('空间治理','按配额、保留期和项目归属管理',badge('策略待定义'))}${strip('本 Demo 不执行清理、格式化或删除操作。正式产品需提供配额、保留期和删除确认。')}</section></div>`;
}

function ready(id){
  if(licenseExpired())return '授权已过期';
  if(!productApps[id])return '程序不存在';
  if(productApps[id].planned)return '等待后续开发';
  if(!license.features.includes(id))return '未授权';
  if(!hardware)return '板载算力或硬件条件不足';
  if(!productApps[id].installed)return '应用包未安装';
  if(id==='teleop'&&!camera)return '相机未连接，数采条件不满足';
  if(session)return '模拟会话占用中';
  return '';
}
function appsPage(){
  const id=route.split('/')[1],app=productApps[id],reason=ready(id);
  const heading=title(app.name,app.desc);
  if(app.planned){
    return heading+'<section class="panel program-placeholder"><div class="program-preview"><div class="preview-label">ONE-G / '+(id==='gem'?'GEM':'TELEOP 03')+'</div><div class="module-frame">'+programIcon(id)+'</div><span class="preview-caption">PROGRAM MODULE</span></div><div class="placeholder-copy"><span class="release-label">规划中的程序</span><h2>等待后续开发</h2><p>'+esc(app.desc)+'</p><div class="placeholder-note">此页面为预留入口，当前不提供启动功能。</div></div></section>';
  }
  if(id!=='teleop'){
    return heading+'<section class="panel program-placeholder"><div class="program-preview"><div class="preview-label">ONE-G / PERFORMANCE</div><div class="module-frame">'+programIcon(id)+'</div><span class="preview-caption">PROGRAM MODULE</span></div><div class="placeholder-copy"><span class="release-label">内置程序</span><h2>'+esc(reason||'程序已就绪')+'</h2><p>'+(license.features.includes(id)?'授权已包含此程序，安装后即可使用。':'当前授权尚未包含此程序。')+'</p>'+button(reason||'查看操作流程','launch-'+id,!reason,!!reason)+'</div></section>';
  }
  const stages=[
    ['连接设备','选择 PICO 有线或无线连接'],
    ['人体校准','按提示完成输入校验'],
    ['检查机器人','确认 G1 与现场状态'],
    ['闭环验证','验证输入、模型和动作输出'],
    ['确认接管','现场确认后进入遥操'],
    ['结束与保存','停止操作并保存采集记录']
  ];
  return heading+'<div class="grid program-layout"><section class="panel program-guide"><div class="program-heading"><div class="program-symbol">'+programIcon(id)+'</div><div><div class="eyebrow">PICO × G1</div><h2>五点遥操与数采</h2></div></div><p class="program-description">按顺序完成准备，再进入遥操。当前可查看完整操作流程。</p><ol class="program-flow">'+stages.map(([name,desc],i)=>'<li><span class="program-step-number">0'+(i+1)+'</span><div><h3>'+name+'</h3><p>'+desc+'</p></div></li>').join('')+'</ol><div class="program-action">'+button(reason||'查看操作流程','launch-teleop',!reason,!!reason)+'<span class="small muted">交互演示 · 未连接设备</span></div></section><aside class="panel program-status"><div class="section-head"><h2>当前状态</h2>'+badge(reason?'待处理':'可预览',reason?'warn':'ok')+'</div>'+row('程序授权',license.features.includes(id)?'已包含五点遥操':'当前授权不包含此程序',badge(license.features.includes(id)?'已授权':'未授权',license.features.includes(id)?'ok':'warn'))+row('板载算力',hardware?'示例配置满足要求':'请确认板载硬件',badge(hardware?'就绪':'不足',hardware?'ok':'warn'))+row('数采相机',camera?'示例相机已连接':'相机未连接，数采条件不满足',badge(camera?'已连接':'未连接',camera?'ok':'warn'))+row('控制会话',session?'当前模拟会话被占用':'当前没有控制会话',badge(session?'占用中':'空闲',session?'warn':'ok'))+'<details class="program-details"><summary>查看运行版本</summary><p>SONIC Runtime · 版本待正式锁定<br>固定橡胶手配置 · 示例包已安装</p></details></aside></div>';
}

function render(focus=false){
  if(route==='apps')route='apps/teleop';
  if(!allowed().includes(route))route='overview';
  if(location.hash.slice(1)!==route)history.replaceState(null,'','#'+route);
  const programs=license.tier==='apply'&&!licenseExpired()?'<div class="program-group"><div class="nav-separator"></div><div class="nav-group-label">应用程序</div><div class="program-list">'+Object.entries(productApps).map(([id,app])=>'<a class="app-entry" href="#apps/'+id+'" '+(route==='apps/'+id?'aria-current="page"':'')+'>'+programIcon(id)+'<span class="program-name">'+esc(app.name)+'</span></a>').join('')+'</div></div>':'';
  document.getElementById('nav').innerHTML='<div class="common-group"><div class="nav-group-label">设备管理</div>'+navDefs.map(n=>'<a href="#'+n.href+'" '+(groupOf(route)===n.group?'aria-current="page"':'')+'>'+icon(n.icon)+n.label+'</a>').join('')+'</div>'+programs;
  document.getElementById('crumb').textContent=routeLabels[route]||'设备概览';
  document.getElementById('tier-name').textContent=names[license.tier];
  const page=route==='overview'?overview:groupOf(route)==='devices'?devicesPage:groupOf(route)==='diagnostics'?diagnosticsPage:groupOf(route)==='api'?apiPage:groupOf(route)==='settings'?settingsPage:appsPage;
  document.getElementById('main').innerHTML=page()+`<footer class="footnote"><span>ONE-G ROBOTICS <span aria-hidden="true">/</span> RobotDock</span><span>离线交互 Demo · 不连接设备，不发送控制指令</span></footer>`;
  if(focus)document.getElementById('main').focus({preventScroll:true});
  scheduleExpiryRefresh();
}
function go(r){
  if(r==='apps')r='apps/teleop';
  if(!allowed().includes(r))r='overview';
  if(location.hash==='#'+r){route=r;render(true);window.scrollTo(0,0);}else location.hash=r;
}
let expiryTimer;
function scheduleExpiryRefresh(){
  clearTimeout(expiryTimer);
  if(license.expires_at===null||licenseExpired())return;
  const delay=Math.min(Date.parse(license.expires_at)-Date.now()+50,2147483647);
  expiryTimer=setTimeout(()=>{if(!allowed().includes(route)){route='overview';history.replaceState(null,'','#overview');}render();},delay);
}
window.addEventListener('hashchange',()=>window.scrollTo(0,0));
window.example=example;
route=location.hash.slice(1)||'overview';
render();
</script>
</body>
